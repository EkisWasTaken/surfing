[package]
name = "surf-sandbox"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# The app only opens a window around the game, so size matters more than Rust speed.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
